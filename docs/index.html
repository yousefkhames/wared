<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wared | Emails to kanban cards and calendar</title>
<meta name="description" content="Paste your emails. Wared finds what matters and turns it into kanban cards and calendar items. Runs in your browser, nothing is uploaded.">
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="logo.svg"><meta name="theme-color" content="#191c4a">
<script>try{var th=localStorage.getItem("wared.theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=th}catch(e){}</script><link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<header class="top" role="banner">
  <div class="brand"><img src="logo.svg" alt="" width="36" height="36"><div><b data-i18n="brand">Wared</b><small data-i18n="tag">Important emails, sorted</small></div></div>
  <nav aria-label="Views"><button id="viewBoard" class="tab on" aria-pressed="true" data-i18n="board">Board</button><button id="viewCal" class="tab" aria-pressed="false" data-i18n="calendar">Calendar</button>
  <button id="theme" class="ghost" aria-label="Toggle dark mode" title="Dark / light">◐</button><button id="lang" class="ghost">العربية</button></nav>
</header>
<main id="main" tabindex="-1">
<section class="panel" id="inbox">
  <h2 data-i18n="paste">Paste emails</h2>
  <p class="hint" data-i18n="privacy">Private by design: your text is processed in this page only. Nothing is uploaded or read from your inbox. Separate emails with a line of ---.</p>
  <label for="src" class="sr" data-i18n="paste">Paste emails</label>
  <textarea id="src" rows="9" spellcheck="false"></textarea>
  <div class="row"><button id="go" class="primary" data-i18n="extract">Extract cards</button><button id="sample" class="ghost" data-i18n="sample">Try a sample</button><button id="clear" class="ghost" data-i18n="clearBoard">Clear board</button></div>
  <div id="preview" class="preview" hidden></div>
</section>
<div class="bar" id="bar"><label class="sr" for="q" data-i18n="search">Search</label><input id="q" type="search" data-ph="search"><label class="sr" for="pf" data-i18n="pri">Priority</label><select id="pf"><option value="">—</option><option value="high" data-i18n="high">High</option><option value="medium" data-i18n="medium">Medium</option><option value="low" data-i18n="low">Low</option></select><span id="stats" class="stats"></span></div>
<section id="board" class="board" aria-label="Kanban board"></section>
<section id="cal" class="cal" hidden></section>
</main>
<footer><span data-i18n="foot">Free and open source (MIT). Data stays in your browser.</span>
<span><button id="ics" class="ghost" data-i18n="exportIcs">Export .ics</button> <button id="exp" class="ghost" data-i18n="exportJson">Export JSON</button> <button id="imp" class="ghost" data-i18n="importJson">Import JSON</button><input id="impf" type="file" accept="application/json,.json" hidden></span></footer>
<div id="toast" class="toast" hidden></div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-label="Edit card"><form method="dialog" id="edit"></form></dialog>
<script src="parser.js"></script><script src="app.js"></script>
</body></html>
